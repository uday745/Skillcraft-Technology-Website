name: CI Maven Build & Docker Publish

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: temurin

      # 🔹 Read version from pom.xml
      - name: Read version
        run: |
          echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      # 🔹 Build Maven package
      - name: Build with Maven
        run: mvn clean package

      # 🔹 Docker login
      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 🔹 Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/skillcraft-website:${{ env.VERSION }} .

      # 🔹 Push Docker image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/skillcraft-website:${{ env.VERSION }}

      # 🔹 Generate dynamic K8s YAML
      - name: Generate K8s YAML
        run: |
          export VERSION=${{ env.VERSION }}
          export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          envsubst < k8s/k8s-deploy-template.yaml > k8s-deploy.yaml

      # 🔹 Deploy to Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s-deploy.yaml
          kubectl rollout status deployment/skillcraft-website -n default
