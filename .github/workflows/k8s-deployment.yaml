name: CI Maven Build & Docker Publish

on:
  workflow_dispatch:
    inputs:
      deploy_env:
        description: "Deploy target environment"
        required: true
        type: choice
        options:
          - dev
          - prod
          - both

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # 🔹 Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔹 Setup JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: temurin

      # 🔹 Read version from pom.xml
      - name: Read version
        run: |
          echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV
          echo "Project version is $VERSION"

      # 🔹 Build Maven package
      - name: Build with Maven
        run: mvn clean package

      # 🔹 Docker login
      - name: Docker Login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 🔹 Cleanup old Docker images (keep current version)
      - name: Cleanup old skillcraft-website images
        run: |
          IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/skillcraft-website"
          CURRENT_TAG="${IMAGE_NAME}:${{ env.VERSION }}"

          echo "Keeping current image: $CURRENT_TAG"

          OLD_IMAGES=$(docker images "$IMAGE_NAME" --format "{{.Repository}}:{{.Tag}}" | grep -v "$CURRENT_TAG" || true)

          if [ -n "$OLD_IMAGES" ]; then
            echo "Deleting old images:"
            echo "$OLD_IMAGES"
            echo "$OLD_IMAGES" | xargs docker rmi -f
          else
            echo "No old images to delete"
          fi

      # 🔹 Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/skillcraft-website:${{ env.VERSION }} .

      # 🔹 Push Docker image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/skillcraft-website:${{ env.VERSION }}

      # 🔹 Generate dynamic Kubernetes YAML
      - name: Generate Kubernetes YAML (Dynamic Image)
        run: |
          export VERSION=${{ env.VERSION }}
          export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

          envsubst < k8s-deploy-template.yaml > k8s-deploy.yaml

          echo "Generated Kubernetes manifest:"
          cat k8s-deploy.yaml

      # 🔹 Deploy to Kubernetes based on input environment
      - name: Deploy to Kubernetes
        run: |
          ENV="${{ github.event.inputs.deploy_env }}"

          if [[ "$ENV" == "dev" ]]; then
            echo "Deploying to DEV environment"
            kubectl apply -f k8s-deploy.yaml -n dev
            kubectl rollout status deployment/skillcraft-website -n dev

          elif [[ "$ENV" == "prod" ]]; then
            echo "Deploying to PROD environment"
            kubectl apply -f k8s-deploy.yaml -n prod
            kubectl rollout status deployment/skillcraft-website -n prod

          elif [[ "$ENV" == "both" ]]; then
            echo "Deploying to both DEV and PROD environments"
            kubectl apply -f k8s-deploy.yaml -n dev
            kubectl rollout status deployment/skillcraft-website -n dev

            kubectl apply -f k8s-deploy.yaml -n prod
            kubectl rollout status deployment/skillcraft-website -n prod
          fi
