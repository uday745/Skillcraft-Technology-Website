name: Trivy FS Scan

on:
  workflow_dispatch:   # manual trigger

jobs:
  trivy-scan:
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
          | gpg --dearmor \
          | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update -y
          sudo apt-get install -y trivy

      - name: Verify Trivy Installation
        run: trivy --version

      - name: Run Trivy Filesystem Scan (JSON)
        run: trivy fs --format table -o fs-report.json .

      - name: Save Trivy report locally on runner
        run: |
          REPORT_DIR="/var/log/trivy"
          sudo mkdir -p $REPORT_DIR
          sudo cp fs-report.json $REPORT_DIR/
          sudo chmod 644 $REPORT_DIR/fs-report.json

          echo "✅ Trivy report saved at:"
          echo "$REPORT_DIR/fs-report.json"
